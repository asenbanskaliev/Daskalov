name: Brand browsers - Chrome and Edge smoke
on:
  push:
    branches: ["feat/**"]
    paths:
      - "src/**"
      - "server/**"
      - "index.html"
      - "e2e/brand-smoke.spec.js"
      - "playwright.brands.config.mjs"
      - ".github/workflows/browser-brands.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: brands-${{ github.ref }}
  cancel-in-progress: true
jobs:
  brand-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chrome and Microsoft Edge
        run: npx playwright install --with-deps chrome msedge
      - run: npm run build
      - name: Real brand browser smoke, synthetic demo only
        run: npx playwright test --config=playwright.brands.config.mjs
      - name: Upload sanitized trace on failure only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daskalov-brand-browser-report
          path: test-results/
          retention-days: 3
