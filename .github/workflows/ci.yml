name: CI - ODD TDD
on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build:
    name: Unit, contracts and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests with mocks
        run: npm test
      - name: Build web
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: daskalov-web-preview
          path: dist/
          retention-days: 7
