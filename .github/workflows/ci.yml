name: CI - ODD TDD
on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-build:
    name: Unit, contracts and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      # Bootstrap ONLY for initial lockfile generation. Remove after committing package-lock.json.
      - name: Bootstrap lockfile (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo DASKALOV_PACKAGE_LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo DASKALOV_PACKAGE_LOCK_END
      - name: Install reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests with mocks
        run: npm test
      - name: Build web
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daskalov-web-preview
          path: dist/
          retention-days: 7
