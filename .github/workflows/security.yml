name: Security Audit - no secrets
on:
  push:
    branches:
      - "feat/**"
    paths:
      - "server/**"
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund
      - name: Security contracts
        run: node --test tests/security-headers.test.mjs tests/workflow-policy.test.mjs tests/security-session.test.mjs tests/turn-protocol.test.mjs
      - name: Audit critical production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: SBOM inventory
        run: npm run security:sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daskalov-sbom-inventory
          path: reports/sbom-dependencies.json
          retention-days: 7
