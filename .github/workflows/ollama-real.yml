name: Ollama Cloud - REAL smoke
# Manual ONLY, and only from trusted main after review.
# Configure environment "daskalov-cloud-test" with required reviewers in GitHub Settings.
# Secrets are NEVER provided to pull requests or editable feature branches.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daskalov-real-ollama-smoke
  cancel-in-progress: true
jobs:
  beam-api:
    if: github.repository == 'asenbanskaliev/Daskalov' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: daskalov-cloud-test
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Smoke Ollama Cloud API with repository secret
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_MODEL: beam
        run: node scripts/ollama-cloud-smoke.mjs
